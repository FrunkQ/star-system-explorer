[package]
name = "sse-import-v3"
description = "SSE4 one-way importer for Star System Explorer 3 saves (P3)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
sse-core.workspace = true
sse-chronicle.workspace = true
sse-flow.workspace = true
sse-atoms.workspace = true
# Only `reconstruct` (F9) needs formation; the slim browser build
# (sse-convert-wasm) leaves it out.
sse-formation = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[features]
default = ["reconstruct"]
reconstruct = ["dep:sse-formation"]
