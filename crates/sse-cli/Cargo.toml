[package]
name = "sse-cli"
description = "SSE4 native tool: harness, golden checks, pack validation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "sse"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
sse-core.workspace = true
sse-catalogue = { path = "../sse-catalogue" }
sse-import-v3 = { workspace = true, features = ["reconstruct"] }
