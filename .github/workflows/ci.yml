name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # x86-64 Linux, arm64 macOS, x86-64 Windows: native golden hashes must agree.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: matrix.os == 'ubuntu-latest'
        name: generated TypeScript types are committed and current
        run: git diff --exit-code packages/contracts/src/generated
      - run: cargo run -q -p sse-cli --release -- harness

  wasm:
    name: wasm (node + browsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: rustup show
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: scripts/build-harness.sh
      - run: npm run typecheck
      - run: node tests/harness/run-node.mjs
      - run: npm test
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium firefox webkit
      - run: node tests/harness/run-browsers.mjs chromium firefox webkit
      - uses: actions/upload-pages-artifact@v3
        with: { path: tests/harness }

  ui:
    name: ui (GM shell, U0 and U1 checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: rustup show
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: scripts/build-wasm.sh
      - run: npm run ui:check
      - run: npm run ui:test
      - run: scripts/build-shell.sh
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium firefox
      - run: node tests/ui/shell.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/players.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/setup.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/themes.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/symbols.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/styles.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/p2p.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/system3d.e2e.mjs chromium firefox --screens ui-screens
      - uses: actions/upload-artifact@v4
        with: { name: ui-screens, path: ui-screens }

  # Publishes the harness page so it can be opened on phones and tablets.
  # Needs GitHub Pages enabled with source "GitHub Actions" (repo Settings, Pages).
  pages:
    if: github.event_name == 'push'
    needs: wasm
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    continue-on-error: true
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
