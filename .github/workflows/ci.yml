name: ci
on:
  # Pull requests run once each (no second run for the branch push); main runs after every merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly full run of every job on main, to catch anything the PR skips miss (Alex, 21 Nov: "test periodically").
  schedule:
    - cron: '17 3 * * *'

# A newer push to the same pull request cancels the older run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts a pull request touches. On main, nightly and manual runs everything runs.
  #   docs only (docs/, handover/, any .md): no jobs beyond this one
  #   UI only (packages/, tests/ui/, package files): wasm and ui, no three-OS Rust matrix
  #   anything else (crates, packs, goldens, scripts, workflows ...): every job
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: f
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "$files"
          rust=false; web=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|handover/*|*.md) ;;
              packages/*|tests/ui/*|package.json|package-lock.json|tsconfig*.json) web=true ;;
              *) rust=true; web=true ;;
            esac
          done <<< "$files"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"; echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "rust=$rust web=$web"

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # x86-64 Linux, arm64 macOS, x86-64 Windows: native golden hashes must agree.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: matrix.os == 'ubuntu-latest'
        name: generated TypeScript types are committed and current
        run: git diff --exit-code packages/contracts/src/generated
      - if: matrix.os == 'ubuntu-latest'
        name: master data sheet is current with its sources
        run: python3 scripts/build-base-reference.py --check
      - if: matrix.os == 'ubuntu-latest'
        name: no new typed constants or material numbers (MP22 ledger)
        run: |
          git fetch --depth=1 origin main
          python3 scripts/test-audit-matter.py
          python3 scripts/audit-matter.py --ledger handover/packages/MP0-typed-copies.txt --base FETCH_HEAD
      - if: matrix.os == 'ubuntu-latest'
        name: no new physics side doors (ER ledger, may only shrink)
        run: |
          git fetch --depth=1 origin main
          python3 scripts/test-audit-side-doors.py
          python3 scripts/audit-side-doors.py --check --base FETCH_HEAD
      - run: cargo run -q -p sse-cli --release -- harness

  wasm:
    name: wasm (node + browsers)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with: { cache-bin: true }
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: scripts/build-harness.sh
      - run: npm run typecheck
      - run: node tests/harness/run-node.mjs
      - run: npm test
      - run: npm install --no-save playwright@1.63.0 && (for i in 1 2 3; do npx playwright install --with-deps chromium firefox webkit && exit 0; echo "browser install failed (try $i), retrying"; sudo apt-get update || true; sleep 45; done; exit 1)
      - run: node tests/harness/run-browsers.mjs chromium firefox webkit

  ui:
    name: ui (GM shell, U0 and U1 checks)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with: { cache-bin: true }
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: scripts/build-wasm.sh
      - run: npm run ui:check
      - run: npm run ui:test
      - run: scripts/build-shell.sh
      - run: npm install --no-save playwright@1.63.0 && (for i in 1 2 3; do npx playwright install --with-deps chromium firefox && exit 0; echo "browser install failed (try $i), retrying"; sudo apt-get update || true; sleep 45; done; exit 1)
      - run: node tests/ui/shell.e2e.mjs chromium firefox --screens ui-screens
      # The stage 1 test drive (handover/test-drive.md): the whole walk, desktop and phone, presses counted per step.
      - run: node tests/ui/walk.e2e.mjs --screens ui-screens
      - run: node tests/ui/players.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/setup.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/themes.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/symbols.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/styles.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/p2p.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/system3d.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/lenses.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/sound.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/whatif.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/agents.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/orac.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/minerva.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/light.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/make.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/lookahead.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/cutaway.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/adopt.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/globe.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/compare.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/render.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/postcards.e2e.mjs --screens ui-screens/postcards
      - run: node tests/ui/hold-grounds.e2e.mjs --screens ui-screens/hold-grounds
      - run: node tests/ui/campaign.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/biosphere.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/time.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/rollcall.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/tactile.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/atlas.e2e.mjs --screens ui-screens
      - run: node tests/ui/kits.e2e.mjs --screens ui-screens/kits
      - run: node tests/ui/your-systems.e2e.mjs chromium firefox --screens ui-screens
      - run: node tests/ui/perf.e2e.mjs --screens ui-screens
      - run: node tests/ui/enlarge.e2e.mjs
      - run: node tests/ui/ladder-gpu.e2e.mjs
      - run: node tests/ui/aurora.e2e.mjs --screens ui-screens
      - run: node tests/ui/composite.e2e.mjs --screens ui-screens
      - run: node tests/ui/hazard.e2e.mjs --screens ui-screens
      # The landing run-through (track LR): GM and a joined player, Earth to Mars, orbit, Land, the ground, take-off.
      - run: node tests/ui/run-through.e2e.mjs
      # The Formation screen (F10a): how a grown system was made, read from its record; the slice moves the ruler.
      - run: node tests/ui/formation.e2e.mjs --screens ui-screens
      # Ship manifest and crew (track MC): aboard, life support, Known to, pictures, fuel and the ship's log.
      - run: SSE_SHOTS=ui-screens/manifest node tests/ui/manifest.e2e.mjs
      # The star chooser (PR 615): pick a star for a new system.
      - run: node tests/ui/star-chooser.e2e.mjs --screens ui-screens/star-chooser
      # The star class gallery and star picker (SC1): every kind live in True, both sizes, a giant's cells, Make a system's picker.
      - run: SCREENS=ui-screens/star-gallery node tests/ui/star-gallery.e2e.mjs
      - uses: actions/upload-artifact@v4
        with: { name: ui-screens, path: ui-screens }
