[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["FrunkQ"]
repository = "https://github.com/FrunkQ/star-system-explorer"
rust-version = "1.97"

[workspace.dependencies]
# libm is THE pinned maths library (H3). Exact version on purpose: a change here
# can change bits, which changes golden hashes. Bump only with an ADR.
libm = "=0.2.16"
sha2 = "0.11"
ciborium = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
semver = { version = "1", features = ["serde"] }
proptest = "1"
sse-core = { path = "crates/sse-core" }
sse-chronicle = { path = "crates/sse-chronicle" }
sse-record = { path = "crates/sse-record" }
sse-flow = { path = "crates/sse-flow" }
sse-pack = { path = "crates/sse-pack" }
sse-reference = { path = "crates/sse-reference" }
sse-atoms = { path = "crates/sse-atoms" }
sse-import-v3 = { path = "crates/sse-import-v3", default-features = false }
sse-world = { path = "crates/sse-world" }
sse-formation = { path = "crates/sse-formation" }
sse-kernel = { path = "crates/sse-kernel" }
sse-climate = { path = "crates/sse-climate" }
sse-surface = { path = "crates/sse-surface" }
sse-weather = { path = "crates/sse-weather" }
sse-nav = { path = "crates/sse-nav" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The formation suite's population tests run 10,000 systems; optimise it in
# test builds too (same IEEE arithmetic, no fast-math, so results are unchanged).
[profile.dev.package.sse-formation]
opt-level = 2

# Surface tiles sample a height function tens of thousands of times; same reason.
[profile.dev.package.sse-surface]
opt-level = 2

# The star count tree reads the galaxy envelope thousands of times per sky walk.
[profile.dev.package.sse-cosmos]
opt-level = 2

# A sky draw integrates passbands for thousands of stars; same reason.
[profile.dev.package.sse-light]
opt-level = 2

# Keyed draws and the stellar relations run once per star in a sky draw.
[profile.dev.package.sse-core]
opt-level = 2

# The glow map integrates 12,288 sight lines of 96 steps.
[profile.dev.package.sse-sky]
opt-level = 2

[profile.dev.package.sse-atoms]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

# The disc trace (XO3) runs a formula block and a bend-table read for each of
# about a hundred thousand rays, and the bend table is two million RK4 steps.
[profile.dev.package.sse-gravity]
opt-level = 2

[profile.dev.package.sse-formula]
opt-level = 2
